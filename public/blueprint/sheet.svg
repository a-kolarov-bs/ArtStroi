<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1500" width="2000" height="1500">
  <defs>
    <style>
      .ln  { stroke: #1A1F26; stroke-opacity: 0.05; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
      .lnf { stroke: #1A1F26; stroke-opacity: 0.035; fill: none; }
      .red { stroke: #BA2D20; stroke-opacity: 0.22; fill: none; }
      .redf{ fill: #BA2D20; fill-opacity: 0.18; stroke: none; }
      .tx  { fill: #1A1F26; fill-opacity: 0.20; stroke: none; font-family: ui-monospace,SFMono-Regular,monospace; font-size: 12px; letter-spacing: 0.05em; }
      .txr { fill: #BA2D20; fill-opacity: 0.32; stroke: none; font-family: ui-monospace,SFMono-Regular,monospace; font-size: 12px; letter-spacing: 0.05em; }
    </style>
  </defs>

  <!-- ==== APARTMENT PLAN — top-left, occupies ~40% of tile ==== -->
  <g class="ln">
    <path d="M 80 200 L 80 700 L 700 700" stroke-width="1.6"/>
    <path d="M 92 212 L 92 688 L 688 688"/>
    <line x1="80" y1="200" x2="280" y2="200" stroke-width="1.6"/>
    <line x1="380" y1="200" x2="700" y2="200" stroke-width="1.6"/>
    <line x1="92" y1="212" x2="280" y2="212"/>
    <line x1="380" y1="212" x2="688" y2="212"/>
    <line x1="700" y1="200" x2="700" y2="430" stroke-width="1.6"/>
    <line x1="688" y1="212" x2="688" y2="430"/>
    <!-- Interior partitions -->
    <line x1="320" y1="212" x2="320" y2="430" stroke-width="1.4"/>
    <line x1="328" y1="220" x2="328" y2="430"/>
    <line x1="320" y1="430" x2="700" y2="430" stroke-width="1.4"/>
    <line x1="320" y1="438" x2="700" y2="438"/>
    <line x1="500" y1="430" x2="500" y2="700" stroke-width="1.4"/>
    <line x1="508" y1="438" x2="508" y2="688"/>
    <!-- Door swings -->
    <path d="M 280 280 A 60 60 0 0 1 340 340" stroke-dasharray="2 4"/>
    <path d="M 500 540 A 70 70 0 0 1 570 610" stroke-dasharray="2 4"/>
    <path d="M 320 540 A 60 60 0 0 0 380 600" stroke-dasharray="2 4"/>
    <!-- Windows (double thin line) -->
    <line x1="120" y1="200" x2="240" y2="200" stroke-width="3"/>
    <line x1="120" y1="208" x2="240" y2="208" stroke-width="0.5"/>
    <line x1="430" y1="200" x2="600" y2="200" stroke-width="3"/>
    <line x1="430" y1="208" x2="600" y2="208" stroke-width="0.5"/>
    <line x1="80" y1="320" x2="80" y2="430" stroke-width="3"/>
    <line x1="88" y1="320" x2="88" y2="430" stroke-width="0.5"/>
  </g>
  <!-- Furniture (very faint) -->
  <g class="lnf">
    <rect x="380" y="280" width="200" height="120"/>
    <path d="M 380 280 Q 430 295, 480 280"/>
    <path d="M 490 280 Q 540 295, 580 280"/>
    <line x1="120" y1="240" x2="280" y2="240" stroke-dasharray="2 2"/>
    <circle cx="160" cy="320" r="12"/>
    <circle cx="200" cy="320" r="12"/>
  </g>
  <!-- Brand red structural columns -->
  <g class="redf">
    <rect x="312" y="422" width="14" height="14"/>
    <rect x="494" y="422" width="14" height="14"/>
    <rect x="494" y="680" width="14" height="14"/>
  </g>
  <!-- Brand red centerline -->
  <line class="red" x1="380" y1="170" x2="380" y2="730" stroke-dasharray="14 4 2 4"/>
  <!-- Top dimension chain — sparse -->
  <g class="ln" stroke-width="0.45">
    <line x1="80" y1="160" x2="700" y2="160" stroke-dasharray="3 4"/>
    <line x1="80" y1="154" x2="80" y2="166"/>
    <line x1="380" y1="154" x2="380" y2="166"/>
    <line x1="700" y1="154" x2="700" y2="166"/>
  </g>
  <text class="tx" x="230" y="148" text-anchor="middle">3.20m</text>
  <text class="tx" x="540" y="148" text-anchor="middle">4.65m</text>
  <!-- Room labels -->
  <text class="tx" x="495" y="335" text-anchor="middle">СПАЛНЯ · 16.2m²</text>
  <text class="tx" x="200" y="320" text-anchor="middle">КУХНЯ</text>
  <text class="tx" x="600" y="565" text-anchor="middle">ХОЛ · 28m²</text>
  <text class="tx" x="290" y="600" text-anchor="middle">КОРИДОР</text>
  <!-- Section marker (red) -->
  <g class="red">
    <circle cx="56" cy="200" r="11" stroke-width="1"/>
  </g>
  <text class="txr" x="56" y="204" text-anchor="middle">A</text>

  <!-- ==== SECTION CUT MARKER B-B (horizontal red dashed) ==== -->
  <g class="red">
    <circle cx="900" cy="380" r="13" stroke-width="1"/>
    <circle cx="1380" cy="380" r="13" stroke-width="1"/>
    <line x1="913" y1="380" x2="1367" y2="380" stroke-dasharray="14 4 2 4" stroke-width="1"/>
  </g>
  <text class="txr" x="900" y="384" text-anchor="middle">B</text>
  <text class="txr" x="1380" y="384" text-anchor="middle">B</text>
  <text class="tx" x="1140" y="370" text-anchor="middle">SECTION B-B</text>

  <!-- ==== SCATTERED ANNOTATIONS — sparse, drafting paper feel ==== -->
  <text class="tx" x="900" y="120">SHEET A-101 · UPPER FL ADDITION</text>
  <text class="tx" x="1500" y="200">SCALE 1:50</text>
  <text class="tx" x="1700" y="500" transform="rotate(-90 1700 500)">M = 25.40m</text>
  <text class="tx" x="120" y="900">+0.00 = ±0.000</text>
  <text class="tx" x="900" y="1100">REV.03 · 05.2024 · АРТСТРОЙ ООД</text>

  <!-- ==== Sparse cross marks at 200px intervals — drafting registration ==== -->
  <g class="ln" stroke-width="0.5" stroke-opacity="0.06">
    <path d="M 1000 800 v 8 M 996 804 h 8"/>
    <path d="M 1400 1000 v 8 M 1396 1004 h 8"/>
    <path d="M 1700 1100 v 8 M 1696 1104 h 8"/>
    <path d="M 200 1200 v 8 M 196 1204 h 8"/>
    <path d="M 800 1300 v 8 M 796 1304 h 8"/>
    <path d="M 1500 1400 v 8 M 1496 1404 h 8"/>
  </g>

  <!-- ==== Sparse contour line — bottom-right ==== -->
  <g class="lnf" stroke-dasharray="6 8">
    <path d="M 1100 1200 Q 1300 1180, 1500 1200 T 1900 1220"/>
    <path d="M 1100 1280 Q 1300 1260, 1500 1280 T 1900 1300"/>
  </g>
  <text class="tx" x="1750" y="1190">+108.25</text>

  <!-- Title block — bottom-right corner, very subtle -->
  <g class="ln" stroke-width="0.5">
    <rect x="1700" y="1410" width="280" height="60"/>
    <line x1="1700" y1="1430" x2="1980" y2="1430"/>
  </g>
  <text class="tx" x="1840" y="1424" text-anchor="middle">АРТСТРОЙ ООД · A-101</text>
  <text class="tx" x="1840" y="1455" text-anchor="middle">M 1:50 · ETAGE 02</text>
</svg>
